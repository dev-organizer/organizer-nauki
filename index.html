<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test pamięci przeglądarki</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --ok: #2e7d32;
      --line: #e2e2de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --card: #222222;
        --text: #ececec;
        --muted: #a0a0a0;
        --ok: #66bb6a;
        --line: #363636;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 16px; }
    .count { font-size: 3rem; font-weight: 700; line-height: 1; }
    .label { color: var(--muted); margin-bottom: 4px; }
    .verdict { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); margin: 16px 0; }
    .verdict.ok { border-color: var(--ok); color: var(--ok); }
    ol, ul { padding-left: 20px; }
    li { margin: 2px 0; }
    .history { color: var(--muted); font-size: 0.9rem; }
    button {
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Czy ta przeglądarka pamięta dane?</h1>
    <div id="result"></div>
  </main>

  <script>
    const KEY = "organizerNauki-test";
    const result = document.getElementById("result");

    function localDay(date) {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function format(date) {
      return new Date(date).toLocaleString("pl-PL", {
        weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    function run() {
      let data;
      try {
        data = JSON.parse(localStorage.getItem(KEY));
        const now = new Date().toISOString();
        if (!data) data = { first: now, opens: [] };
        data.opens = [...data.opens, now].slice(-10);
        data.count = (data.count || 0) + 1;
        localStorage.setItem(KEY, JSON.stringify(data));
      } catch (error) {
        result.innerHTML = `<div class="verdict">❌ Przeglądarka blokuje zapis danych dla tej strony. Aplikacja w tej formie nie będzie tu działać.</div>`;
        return;
      }

      const survivedDay = localDay(data.first) < localDay(new Date());
      let verdict;
      if (survivedDay) {
        verdict = `<div class="verdict ok">✅ Działa. Dane przetrwały od ${format(data.first)}, czyli co najmniej do następnego dnia.</div>`;
      } else if (data.count > 1) {
        verdict = `<div class="verdict ok">Dane są zapamiętane od ${format(data.first)}. Jeśli po drodze było zamknięcie przeglądarki lub wylogowanie z Windows, wynik jest dobry. Ostateczne potwierdzenie: otwórz stronę jutro.</div>`;
      } else {
        verdict = `<div class="verdict">Zapisano pierwsze otwarcie. Teraz:</div>
          <ol>
            <li>Zamknij <strong>wszystkie</strong> okna przeglądarki (samo odświeżenie nic nie sprawdza) i otwórz tę stronę ponownie.</li>
            <li>Wyloguj się z Windows, zaloguj i otwórz stronę jeszcze raz.</li>
            <li>Jutro na kolejnej zmianie otwórz ją ostatni raz.</li>
          </ol>
          <p>Jeśli licznik rośnie (2, 3, 4…), przeglądarka pamięta dane. Jeśli wraca do 1, czyści je.</p>`;
      }

      const history = data.opens.map((d) => `<li>${format(d)}</li>`).join("");
      result.innerHTML = `
        <div class="label">Licznik otwarć tej strony</div>
        <div class="count">${data.count}</div>
        ${verdict}
        <div class="history">Ostatnie otwarcia:<ul>${history}</ul></div>
        <button id="reset">Wyczyść test</button>`;

      document.getElementById("reset").addEventListener("click", () => {
        try { localStorage.removeItem(KEY); } catch (error) {}
        location.reload();
      });
    }

    run();
  </script>
</body>
</html>
