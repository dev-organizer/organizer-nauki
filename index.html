<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer nauki</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <nav>
    <button type="button" data-tab="today">Dziś</button>
    <button type="button" data-tab="progress">Postęp</button>
    <button type="button" data-tab="tasks">Zadania</button>
  </nav>

  <!-- Komunikat o błędzie: widoczny tylko wtedy, gdy coś się nie uda. -->
  <div id="error" role="alert" hidden>
    <p id="error-text"></p>
    <button type="button" id="error-retry">Spróbuj ponownie</button>
  </div>

  <main>
    <section id="today" hidden></section>
    <section id="progress" hidden></section>
    <section id="tasks" hidden></section>
  </main>
</body>
</html>
